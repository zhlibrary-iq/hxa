name: build
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Tg2WA.zip
      - name: Fix ffmpeg dependency
        run: sed -i 's#com.moizhassan.ffmpeg:ffmpeg-kit-16kb:6.0-2#dev.ffmpegkit-maintained:ffmpeg-kit-full:6.0.3#' Tg2WA/app/build.gradle.kts
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - name: Install Gradle
        run: |
          curl -fL --retry 5 --retry-all-errors -o g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q g.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH
      - run: cd Tg2WA && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: apk, path: Tg2WA/app/build/outputs/apk/debug/app-debug.apk}
