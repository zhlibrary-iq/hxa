name: build
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Tg2WA.zip
      - name: Write gradle file
        run: |
          cat > Tg2WA/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.tg2wa"
              compileSdk = 34
              defaultConfig { applicationId = "com.tg2wa"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("dev.ffmpegkit-maintained:ffmpeg-kit-full:6.0.3")
              implementation("com.arthenica:smart-exception-java:0.2.1")
          }
          EOF
      - name: Show real errors
        run: |
          sed -i 's/catch (e: Exception)/catch (e: Throwable)/' Tg2WA/app/src/main/java/com/tg2wa/MainActivity.kt
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - name: Install Gradle
        run: |
          curl -fL --retry 5 --retry-all-errors -o g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q g.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH
      - run: cd Tg2WA && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: apk, path: Tg2WA/app/build/outputs/apk/debug/app-debug.apk}
